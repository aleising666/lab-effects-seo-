# Render blueprint: two scheduled jobs and one small Postgres database.
# Connect the repo in Render, approve the blueprint, then set the secrets
# (GSC_SERVICE_ACCOUNT_JSON, SLACK_WEBHOOK_URL, DataForSEO login) in the dashboard.
databases:
  - name: lab-effects-seo-db
    plan: free

services:
  - type: cron
    name: seo-nightly-crawl
    runtime: python
    schedule: "0 9 * * *"        # 09:00 UTC = 03:00 Denver (02:00 in summer)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m seo all
    envVars:
      - key: SITE_URL
        value: https://labeffects.com
      - key: GSC_PROPERTY
        value: sc-domain:labeffects.com
      - key: KEYWORD_PROVIDER
        value: dataforseo
      - key: COMPETITORS
        value: trueterpenes.com,abstraxtech.com,floraplexterpenes.com
      - key: DATABASE_URL
        fromDatabase:
          name: lab-effects-seo-db
          property: connectionString
      - key: GSC_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        value: C0B1ZM4TASY
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false

  - type: cron
    name: seo-daily-search-console
    runtime: python
    schedule: "0 15 * * *"       # 15:00 UTC, after Google has published the prior days
    buildCommand: pip install -r requirements.txt
    startCommand: python -m seo gsc --days 3
    envVars:
      - key: SITE_URL
        value: https://labeffects.com
      - key: GSC_PROPERTY
        value: sc-domain:labeffects.com
      - key: DATABASE_URL
        fromDatabase:
          name: lab-effects-seo-db
          property: connectionString
      - key: GSC_SERVICE_ACCOUNT_JSON
        sync: false
